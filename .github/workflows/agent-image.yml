name: Agent image

# Build-only check for the sandcastle agent container image, plus the runner's own
# tests. Proves `.sandcastle/Dockerfile` (node:22-bookworm + gh + Claude Code CLI +
# the mattpocock-skills plugin + Rust stable) builds and holds what the gate needs.
# This is not the runner itself; that is agent-implement.yml.

on:
  pull_request:
    paths:
      - '.sandcastle/**'
      - '.github/workflows/agent-image.yml'
  workflow_dispatch:

jobs:
  runner:
    name: Runner typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run sandcastle:typecheck

      - run: npm run sandcastle:test

  build-image:
    name: Build sandcastle agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      # Docker is preinstalled on ubuntu-latest GitHub-hosted runners.
      # `sandcastle docker build-image` builds .sandcastle/Dockerfile, tags it
      # `sandcastle:<repo dir>` (`sandcastle:console` here) and defaults the
      # AGENT_UID/AGENT_GID build args to the runner's uid/gid.
      - name: Build agent image
        run: npx --yes @ai-hero/sandcastle@0.12.0 docker build-image

      - name: Verify toolchain inside image
        run: |
          docker run --rm --entrypoint bash sandcastle:console -lc '
            set -e
            node --version
            npm --version
            gh --version | head -1
            python3 --version
            g++ --version | head -1
            test "$(whoami)" = "agent"
            test -x /home/agent/.local/bin/claude
            # The runner starts every session with a mattpocock-skills slash command.
            claude plugin list | grep -q mattpocock-skills
            # The tui gate: cargo fmt, clippy and test. `-lc` is a LOGIN shell on
            # purpose: it rebuilds PATH from /etc/profile, the strictest mode this
            # container sees.
            rustc --version
            cargo --version
            cargo clippy --version
            cargo fmt --version
          '

      # The end-to-end claim: an agent in this container can build and test the
      # crate it will be asked to work on.
      - name: Verify the agent can build and test the tui crate
        run: |
          docker run --rm \
            -v "$PWD":/home/agent/workspace -w /home/agent/workspace/tui \
            --entrypoint bash sandcastle:console -lc '
              set -euo pipefail
              cargo test 2>&1 | tee /tmp/test.log
              grep -q "test result: ok" /tmp/test.log
            '
