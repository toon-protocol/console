[package]
name = "toon-console-tui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The TOON Console, as a terminal UI (TOON_Network#138, ADR 0028)."

[[bin]]
name = "toon-console-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = "0.3"

[dev-dependencies]
insta = "1"
tempfile = "3"
